groups:
  - name: legal-assist-worker
    rules:
      - alert: LegalAssistWorkerTaskFailures
        expr: sum(rate(legal_assist_celery_tasks_total{status=~"failure|failed"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Legal Assist worker task failures detected
          description: Celery task failures have been observed during the last five minutes. Check the worker logs and failed task details.
