name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Cancel superseded PR runs, but never cancel a deployment-triggered CI run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.11"
  MONGODB_URI: mongodb://localhost:27017
  MONGO_DB_NAME: legal-assist-ci
  GEMINI_API_KEY: ci-dummy-key
  JWT_SECRET: ci-jwt-secret
  SESSION_SECRET: ci-session-secret
  REDIS_URL: redis://localhost:6379/0
  CORS_ORIGINS: '["http://localhost:5173"]'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: Ruff (CI gate)
        run: ruff check backend --select E9,F63,F7,F82

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System libraries (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx
          pip check
      - name: Run regression suite
        working-directory: backend
        run: |
          python -m pytest tests -q             --cov=app             --cov-report=term-missing             --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  worker-deps:
    name: Worker imports with worker-only deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-worker.txt
      - name: Install worker requirements in a clean venv
        working-directory: backend
        run: |
          python -m venv /tmp/worker-venv
          /tmp/worker-venv/bin/pip install --upgrade pip
          /tmp/worker-venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/worker-venv/bin/pip install -r requirements-worker.txt
          /tmp/worker-venv/bin/pip check
      - name: Import worker entry points
        working-directory: backend
        run: |
          /tmp/worker-venv/bin/python -c             "import app.worker.celery_app, app.worker.tasks; print('worker imports OK')"

  docker:
    name: Docker build + smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      API_PORT: "8000"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            dockerfile: Dockerfile
          - target: worker
            dockerfile: Dockerfile.worker
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/${{ matrix.dockerfile }}
          load: true
          tags: legal-assist-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Start container
        run: |
          docker run -d --name app --network host             -e MONGODB_URI -e MONGO_DB_NAME -e GEMINI_API_KEY             -e JWT_SECRET -e SESSION_SECRET -e REDIS_URL -e CORS_ORIGINS             legal-assist-${{ matrix.target }}:ci
      - name: Smoke test API (/health)
        if: matrix.target == 'api'
        run: |
          curl -fsS --retry 40 --retry-delay 3 --retry-connrefused             "http://localhost:${API_PORT}/api/v1/health"
      - name: Smoke test worker (stays up)
        if: matrix.target == 'worker'
        run: |
          sleep 30
          test -n "$(docker ps -q --filter name=app --filter status=running)"
      - name: Container logs
        if: always()
        run: docker logs app || true

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  # Single required status for branch protection.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, backend-tests, worker-deps, docker, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
