name: Deploy API to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-api:
    name: Deploy API Space
    runs-on: ubuntu-latest

    env:
      HF_USERNAME: aadityaa2404
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_API_SPACE: la-space

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Hugging Face token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN GitHub secret is not configured."
            exit 1
          fi

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create API backend subtree
        run: |
          API_SHA=$(git subtree split --prefix=backend HEAD)
          echo "API backend subtree: $API_SHA"
          echo "API_SHA=$API_SHA" >> "$GITHUB_ENV"

      - name: Deploy API backend to Hugging Face
        run: |
          git remote add hf-api \
            "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_API_SPACE}.git"

          git push --force hf-api "${API_SHA}:main"