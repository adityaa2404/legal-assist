version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGO_DB_NAME: legal-assist
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_HTOC_API_KEY: ${GEMINI_HTOC_API_KEY:-}
      GEMINI_CHAT_API_KEY: ${GEMINI_CHAT_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPEN_AI_API_KEY: ${OPEN_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-7200}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-15}
      CORS_ORIGINS: '["http://localhost","http://localhost:80","http://localhost:5173"]'
      REDIS_URL: redis://redis:6379/0
      # Service-to-service DNS inside the compose network — containers never
      # actually sleep here like the HF Spaces do, so this ping is just a
      # harmless no-op fast-path in practice, kept for parity with prod config.
      WORKER_URL: http://worker:10000
      PORT: 8000
    depends_on:
      - mongo
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGO_DB_NAME: legal-assist
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_HTOC_API_KEY: ${GEMINI_HTOC_API_KEY:-}
      GEMINI_CHAT_API_KEY: ${GEMINI_CHAT_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPEN_AI_API_KEY: ${OPEN_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-7200}
      REDIS_URL: redis://redis:6379/0
      PORT: 10000
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mongo_data:
